# Reference workflow for the external engine repo `tkdasofficial/video-agent`.
# Copy to `.github/workflows/video-agent.yml` there.
# Repository secrets: PIXAZO_API_KEY, CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN,
# SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
name: Video Agent Render

on:
  repository_dispatch:
    types: [video_agent_render]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PIXAZO_API_KEY: ${{ secrets.PIXAZO_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VIDEO_ID: ${{ github.event.client_payload.video_id }}
      USER_ID: ${{ github.event.client_payload.user_id }}
      PROMPT: ${{ github.event.client_payload.prompt }}
      NEGATIVE_PROMPT: ${{ github.event.client_payload.negative_prompt }}
      VOICE_GENDER: ${{ github.event.client_payload.voice_gender }}
      IMAGE_STYLE: ${{ github.event.client_payload.image_style }}
      ASPECT_RATIO: ${{ github.event.client_payload.aspect_ratio }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg
          pip install -r requirements.txt

      - name: Mark processing
        run: |
          curl -sS -X PATCH "$SUPABASE_URL/rest/v1/videos?id=eq.$VIDEO_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"status":"processing","step":"Generating scenes","progress":10}'

      # Your pipeline: Pixazo scenes -> Cloudflare AI voice -> FFmpeg render to out.mp4.
      # Append progress with PATCH calls like the step above (step/progress/logs).
      - name: Render video
        run: python render.py

      - name: Upload MP4 to Supabase Storage
        run: |
          curl -sS -X POST \
            "$SUPABASE_URL/storage/v1/object/videos/$USER_ID/$VIDEO_ID.mp4" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: video/mp4" \
            -H "x-upsert: true" \
            --data-binary @out.mp4

      - name: Mark completed
        run: |
          curl -sS -X PATCH "$SUPABASE_URL/rest/v1/videos?id=eq.$VIDEO_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"completed\",\"progress\":100,\"step\":\"Finished\",\"video_url\":\"$USER_ID/$VIDEO_ID.mp4\"}"

      - name: Mark failed
        if: failure()
        run: |
          curl -sS -X PATCH "$SUPABASE_URL/rest/v1/videos?id=eq.$VIDEO_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"status":"failed","error":"Render pipeline failed. See GitHub Actions logs."}'
