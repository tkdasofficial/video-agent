# Reference workflow for the external engine repo `tkdasofficial/video-agent`.
# Copy to `.github/workflows/video-agent.yml` there.
# Repository secrets: PIXAZO_API_KEY, CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN,
# SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
name: Video Agent Render

on:
  repository_dispatch:
    types: [video_agent_render]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Pixazo AI powers scene images ONLY (it has no TTS API).
      PIXAZO_API_KEY: ${{ secrets.PIXAZO_API_KEY }}
      # Optional overrides; defaults are https://api.pixazo.ai + free-tier model.
      PIXAZO_BASE_URL: ${{ secrets.PIXAZO_BASE_URL }}
      PIXAZO_IMAGE_MODEL: ${{ secrets.PIXAZO_IMAGE_MODEL }}
      # Cloudflare Workers AI: script + scene prompts, narration TTS, image fallback.
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Optional model overrides (comma-separated, tried in order).
      CF_LLM_MODEL: ${{ secrets.CF_LLM_MODEL }}
      CF_TTS_MODEL: ${{ secrets.CF_TTS_MODEL }}
      CF_IMAGE_MODEL: ${{ secrets.CF_IMAGE_MODEL }}
      VIDEO_ID: ${{ github.event.client_payload.video_id }}
      USER_ID: ${{ github.event.client_payload.user_id }}
      # Nine flat properties keep repository_dispatch below GitHub's limit.
      PROMPT: ${{ github.event.client_payload.prompt }}
      NEGATIVE_PROMPT: ${{ github.event.client_payload.negative_prompt }}
      VOICE_GENDER: ${{ github.event.client_payload.voice_gender }}
      IMAGE_STYLE: ${{ github.event.client_payload.image_style }}
      ASPECT_RATIO: ${{ github.event.client_payload.aspect_ratio }}
      DURATION_SECONDS: ${{ github.event.client_payload.duration_seconds }}
      CAPTIONS: ${{ github.event.client_payload.captions }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt not found - installing baseline deps"
            pip install requests
          fi

      - name: Mark processing
        run: |
          curl -sS -X PATCH "$SUPABASE_URL/rest/v1/videos?id=eq.$VIDEO_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"status":"processing","step":"Writing script","progress":10}'

      # Cloudflare Workers AI script -> Pixazo images + TTS -> FFmpeg (captions burned in).
      - name: Render video
        run: python render.py

      - name: Upload MP4 to Supabase Storage
        run: |
          curl -sS -X POST \
            "$SUPABASE_URL/storage/v1/object/videos/$USER_ID/$VIDEO_ID.mp4" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: video/mp4" \
            -H "x-upsert: true" \
            --data-binary @out.mp4

      - name: Mark completed
        run: |
          curl -sS -X PATCH "$SUPABASE_URL/rest/v1/videos?id=eq.$VIDEO_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"completed\",\"progress\":100,\"step\":\"Finished\",\"video_url\":\"$USER_ID/$VIDEO_ID.mp4\"}"

      - name: Mark failed
        if: failure()
        run: |
          curl -sS -X PATCH "$SUPABASE_URL/rest/v1/videos?id=eq.$VIDEO_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"status":"failed","error":"Render pipeline failed. See GitHub Actions logs."}'
